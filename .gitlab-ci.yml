stages:
  - test
  - build
  - deploy

.build_paths: &build_paths
  - app/**/*
  - components/**/*
  - lib/**/*
  - shared/**/*
  - db/**/*
  - scripts/**/*
  - locales/**/*
  - public/**/*
  - server/**/*
  - patches/**/*
  - docker/**/*
  - Dockerfile
  - Dockerfile.ci
  - .dockerignore
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - react-router.config.ts
  - vite.config.ts
  - tsconfig.json
  - postcss.config.mjs
  - proxy.ts
  - .gitlab-ci.yml

.build_template: &build_template
  rules:
    - changes: *build_paths

build:
  stage: build
  image: reg.mikumikumi.xyz/base/kaniko-builder:latest
  <<: *build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *build_paths
  needs:
    - job: test
      artifacts: true
  script:
    - export BUILD_DOCKERFILE=Dockerfile.ci
    - export BUILD_DESTINATION="reg.mikumikumi.xyz/kaoru/dashboard:${CI_COMMIT_SHORT_SHA}"
    - build

test:
  stage: test
  image: reg.mikumikumi.xyz/mirror/node:24-bookworm-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: dashboard_test
    POSTGRES_USER: dashboard
    POSTGRES_PASSWORD: dashboard
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: dashboard_test
    PG_USER: dashboard
    PG_PASSWORD: dashboard
    pnpm_config_registry: "https://registry.npmmirror.com"
  <<: *build_template
  rules:
    - changes: *build_paths
    - changes:
        - tests/**/*
        - eslint.config.*
        - vitest.config.*
  before_script:
    - corepack enable
    - pnpm --version
    - pnpm config get registry
    - pnpm install --frozen-lockfile
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm test
    - pnpm run build
    - |
      set -eu
      mkdir -p .ci-runtime/app-build
      cp -a build/. .ci-runtime/app-build/

      prod_dir="$(mktemp -d)"
      trap 'rm -rf "$prod_dir"' EXIT
      cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$prod_dir/"
      cp -a patches "$prod_dir/patches"

      (
        cd "$prod_dir"
        pnpm install --prod --frozen-lockfile \
          --child-concurrency=1 \
          --network-concurrency=4
        sh "$CI_PROJECT_DIR/scripts/prune-runtime-dependencies.sh" node_modules
        node --input-type=module -e '
          import assert from "node:assert/strict";
          const { default: argon2 } = await import("argon2");
          const hash = await argon2.hash("isolated-ci-check");
          assert.equal(await argon2.verify(hash, "isolated-ci-check"), true);
          await import("pg");
          await import("@react-router/node");
        '
        tar -czf "$CI_PROJECT_DIR/.ci-runtime/node_modules.tar.gz" node_modules
        du -sh node_modules "$CI_PROJECT_DIR/.ci-runtime/node_modules.tar.gz"
      )

    - du -sh .ci-runtime/app-build
  artifacts:
    paths:
      - .ci-runtime/
    expire_in: 1 day

deploy:
  stage: deploy
  image: reg.mikumikumi.xyz/base/kubectl:latest
  needs: [build]
  <<: *build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *build_paths
  script:
    - echo "${KUBECONFIG}" > ~/.kube/config
    - "kubectl set image -n kaoru statefulset/dashboard dashboard=reg.mikumikumi.xyz/kaoru/dashboard:${CI_COMMIT_SHORT_SHA} --kubeconfig ~/.kube/config"
