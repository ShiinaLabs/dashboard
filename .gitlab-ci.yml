stages:
  - test
  - build
  - deploy

.build_paths: &build_paths
  - app/**/*
  - components/**/*
  - lib/**/*
  - shared/**/*
  - db/**/*
  - scripts/**/*
  - locales/**/*
  - public/**/*
  - server/**/*
  - patches/**/*
  - Dockerfile
  - Dockerfile.ci
  - .dockerignore
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - react-router.config.ts
  - vite.config.ts
  - tsconfig.json
  - postcss.config.mjs
  - proxy.ts
  - .gitlab-ci.yml

.build_template: &build_template
  rules:
    - changes: *build_paths

build:
  stage: build
  image: reg.mikumikumi.xyz/base/kaniko-builder:latest
  <<: *build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *build_paths
  needs:
    - job: test
      artifacts: true
  script:
    - export BUILD_DOCKERFILE=Dockerfile.ci
    - export BUILD_DESTINATION="reg.mikumikumi.xyz/kaoru/dashboard:${CI_COMMIT_SHORT_SHA}"
    - build

test:
  stage: test
  image: reg.mikumikumi.xyz/mirror/node:22-bookworm-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: dashboard_test
    POSTGRES_USER: dashboard
    POSTGRES_PASSWORD: dashboard
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DB: dashboard_test
    PG_USER: dashboard
    PG_PASSWORD: dashboard
    pnpm_config_registry: "https://registry.npmmirror.com"
  <<: *build_template
  rules:
    - changes: *build_paths
    - changes:
        - tests/**/*
        - eslint.config.*
        - vitest.config.*
  before_script:
    - corepack enable
    - pnpm --version
    - pnpm config get registry
    - pnpm install --store-dir .pnpm-store --frozen-lockfile
  script:
    - pnpm run lint
    - pnpm run typecheck
    - pnpm test
    - pnpm run build
    - mkdir -p .ci-build/build
    - cp -a build/. .ci-build/build/
  artifacts:
    paths:
      - .ci-build/build/
    expire_in: 1 day

deploy:
  stage: deploy
  image: reg.mikumikumi.xyz/base/kubectl:latest
  needs: [build]
  <<: *build_template
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *build_paths
  script:
    - echo "${KUBECONFIG}" > ~/.kube/config
    - "kubectl set image -n kaoru statefulset/dashboard dashboard=reg.mikumikumi.xyz/kaoru/dashboard:${CI_COMMIT_SHORT_SHA} --kubeconfig ~/.kube/config"
